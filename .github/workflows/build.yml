name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DWAppVersion: ${{ github.ref_name }}

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, arm64]

    runs-on: windows-latest

    env:
      Solution_Name: DynamicWin.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Execute unit tests
      run: dotnet test

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Publish application
      run: msbuild DynamicWin/DynamicWin.csproj `
           /t:Publish `
           /p:Configuration=Release `
           /p:Platform=${{ matrix.platform }} `
           /p:RuntimeIdentifier=win-${{ matrix.platform }} `
           /p:SelfContained=false `
           /p:PublishDir=${{ github.workspace }}\publish\Release-${{ matrix.platform }}\

    - name: Publish updater
      run: msbuild Updater/Updater.csproj `
       /t:Publish `
       /p:Configuration=Release `
       /p:RuntimeIdentifier=win-${{ matrix.platform }} `
       /p:SelfContained=false `
       /p:PublishDir=${{ github.workspace }}\publish\Release-${{ matrix.platform }}\

    - name: List published files
      run: dir publish\Release-${{ matrix.platform }}\

    - name: Build installer
      run: |
        iscc Other\DynamicWin-Legacy-Setup.iss `
        /DDWAppVersion=${{ env.DWAppVersion }} `
        /DPlatform=${{ matrix.platform }}

    - name: Generate SHA256 and MD5 hashes
      id: hashes
      shell: pwsh
      run: |
        $installer = "Other\Output\DynamicWinSetup-${{ matrix.platform }}.exe"

        if (!(Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
        }

        $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash
        $md5    = (Get-FileHash $installer -Algorithm MD5).Hash

        $sha256 | Out-File "$installer.sha256"
        $md5    | Out-File "$installer.md5"

        "sha256_${{ matrix.platform }}=$sha256" >> $env:GITHUB_OUTPUT
        "md5_${{ matrix.platform }}=$md5" >> $env:GITHUB_OUTPUT

    - name: Upload artefacts
      uses: actions/upload-artifact@v4
      with:
        name: DynamicWin-${{ matrix.platform }}
        path: |
            Other\Output\DynamicWinSetup-${{ matrix.platform }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Recalculate hashes
        id: hashes
        shell: bash
        run: |
          x64_installer=$(find artifacts -name "DynamicWinSetup-x64.exe" | head -1)
          arm64_installer=$(find artifacts -name "DynamicWinSetup-arm64.exe" | head -1)

          sha256_x64=$(sha256sum "$x64_installer" | awk '{print $1}')
          md5_x64=$(md5sum "$x64_installer" | awk '{print $1}')

          sha256_arm64=$(sha256sum "$arm64_installer" | awk '{print $1}')
          md5_arm64=$(md5sum "$arm64_installer" | awk '{print $1}')

          echo "sha256_x64=${sha256_x64}" >> "$GITHUB_OUTPUT"
          echo "md5_x64=${md5_x64}" >> "$GITHUB_OUTPUT"
          echo "sha256_arm64=${sha256_arm64}" >> "$GITHUB_OUTPUT"
          echo "md5_arm64=${md5_arm64}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          x64_installer=$(find artifacts -name "DynamicWinSetup-x64.exe" | head -1)
          arm64_installer=$(find artifacts -name "DynamicWinSetup-arm64.exe" | head -1)

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "DynamicWin-Legacy $TAG" \
            --notes "# What's new in $TAG

          ### Continued support:
          - Your support truly means a lot to me as I continue to maintain DynamicWin-Legacy. Keep an eye out on this repository whenever a new release comes out.
          - Feel free to contribute to this project as you wish. Open any issues on the issues page if you encounter any bugs.

          ## Checksums

          ### x64
          SHA256: \`${{ steps.hashes.outputs.sha256_x64 }}\`
          MD5: \`${{ steps.hashes.outputs.md5_x64 }}\`

          ### arm64
          SHA256: \`${{ steps.hashes.outputs.sha256_arm64 }}\`
          MD5: \`${{ steps.hashes.outputs.md5_arm64 }}\`" \
            "$x64_installer#DynamicWinSetup-x64.exe" \
            "$arm64_installer#DynamicWinSetup-arm64.exe"

  update-version:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v4
        with:
          ref: updater
          fetch-depth: 0

      - name: Update version-release JSON files
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          X64_URL="https://github.com/${REPO}/releases/download/${TAG}/DynamicWinSetup-x64.exe"
          ARM64_URL="https://github.com/${REPO}/releases/download/${TAG}/DynamicWinSetup-arm64.exe"

          printf '{\n  "version": "%s",\n  "downloadUri": "%s",\n  "releaseStream": "release"\n}\n' \
            "$TAG" "$X64_URL" > version-release-x64.json

          printf '{\n  "version": "%s",\n  "downloadUri": "%s",\n  "releaseStream": "release"\n}\n' \
            "$TAG" "$ARM64_URL" > version-release-arm64.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version-release-x64.json version-release-arm64.json
          git commit -m "Update version-release to ${TAG}"
          git push origin updater
